<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Tahoma,sans-serif;background:#faf8fc;color:#281f30}
header{position:sticky;top:0;z-index:5;background:#fff;border-bottom:1px solid #eee}
.wrap,main{max-width:1200px;margin:auto;padding:14px}
.brand{font-size:29px;font-weight:900}
.sub{font-size:13px;color:#777;margin-top:3px}
.toolbar{display:flex;gap:8px;overflow:auto;margin-top:12px;padding-bottom:3px;scrollbar-width:thin}
.tab{border:0;border-radius:999px;padding:11px 14px;background:#eee;font-weight:800;white-space:nowrap;cursor:pointer}
.tab.active{background:#6d3aa7;color:#fff}
.sizebar{display:none;gap:8px;overflow:auto;margin-top:10px;padding:9px;background:#f7f1fb;border-radius:14px;scrollbar-width:thin}
.sizebar.show{display:flex}
.sizeLink{border:1px solid #dbc9ed;border-radius:999px;padding:9px 13px;background:#fff;color:#4e2b73;text-decoration:none;font-weight:900;white-space:nowrap}

.shareSize{border:0;border-radius:999px;padding:9px 13px;background:#21182a;color:#fff;font-weight:900;white-space:nowrap;cursor:pointer}
.sectionTitle{font-size:22px;font-weight:900;margin:8px 0 4px}
.sectionHint{font-size:13px;color:#777;margin-bottom:10px}
.search{width:100%;margin-top:10px;padding:13px;border:1px solid #ddd;border-radius:13px;font-size:15px}
.cartbtn{width:100%;margin-top:10px;padding:13px;border:0;border-radius:13px;background:#21182a;color:#fff;font-weight:900;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
.card{background:#fff;border:1px solid #eee;border-radius:16px;overflow:hidden;cursor:pointer}
.thumb{width:100%;aspect-ratio:1;object-fit:cover;display:block}
.info{padding:10px}
.code{font-weight:900}
.meta{font-size:12px;color:#777;margin-top:4px}
.price{font-weight:900;margin-top:7px}
.badge{display:inline-block;background:#f0e7f9;padding:4px 7px;border-radius:7px;font-size:11px;margin-top:6px}
.empty{background:#fff;border:1px solid #eee;border-radius:16px;padding:22px;text-align:center;color:#666;line-height:1.9}
.overlay{position:fixed;inset:0;background:#0009;display:none;z-index:20;overflow:auto}
.panel{background:#fff;max-width:780px;margin:18px auto;border-radius:18px;padding:14px}
.close{float:left;border:0;background:#111;color:#fff;border-radius:10px;padding:8px 12px;cursor:pointer}
.hero{width:100%;max-height:62vh;object-fit:contain;background:#f6f2f8;border-radius:13px}
.gallery{display:grid;grid-template-columns:repeat(4,1fr);gap:7px;margin-top:8px}
.gallery img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:8px}
.actions{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
.act{border:0;padding:13px;border-radius:12px;font-weight:900;cursor:pointer}
.save{background:#6d3aa7;color:#fff}
.add{background:#21182a;color:#fff}
.note{background:#f7f1fb;padding:11px;border-radius:12px;margin-top:10px;font-size:13px;line-height:1.7}
.cartoverlay{position:fixed;inset:0;background:#0009;display:none;z-index:30;overflow:auto}
.cartbox{background:#fff;max-width:700px;margin:18px auto;padding:15px;border-radius:18px}
.item{display:flex;gap:9px;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
.item img{width:62px;height:62px;object-fit:cover;border-radius:9px}
.itemmain{flex:1}
.remove{border:0;background:#eee;border-radius:8px;padding:7px;cursor:pointer}
.send{width:100%;border:0;padding:14px;border-radius:12px;background:#1fae55;color:#fff;font-weight:900;margin-top:12px;cursor:pointer}
.fb{display:block;text-align:center;text-decoration:none;padding:12px;border-radius:12px;background:#2684ff;color:#fff;font-weight:900;margin-top:10px}
@media(min-width:700px){
  .grid{grid-template-columns:repeat(4,1fr)}

function esc(s){
  return String(s).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function img(p){
  return 'images/'+String(p).split('/').map(encodeURIComponent).join('/').replaceAll('%2F','/');
}

function money(n){

}

/* Normalize both the stored category and the image path so bag folders remain visible
   even when the source uses variants such as "bag a", "bag c", "bsg c", "BAGS (A)". */
function normalizeCategory(p){
  const rawCat=String(p.category||'').toLowerCase().replace(/[\s_()\-]/g,'');
  const rawPath=(p.images||[]).join(' ').toLowerCase().replace(/[\s_()\-]/g,'');

  if(rawCat==='baga'||rawCat==='baga'||rawCat.includes('biga')||/bags?a|baga|bagar/.test(rawCat) || /bags?a|baga/.test(rawPath)) return 'bag_a';
  if(rawCat==='bagc'||rawCat==='bsgc'||rawCat.includes('bigc')||rawCat.includes('bsgc') || /bagc|bsgc/.test(rawCat) || /bagc|bsgc/.test(rawPath)) return 'bag_c';

  if(['shoes','shoe','qshoes'].includes(rawCat)) return 'shoes';
  if(['clothes','cloth','clothing'].includes(rawCat)) return 'clothes';
  if(rawCat.includes('wallet')||rawCat.includes('jewz')) return 'wallets';
  if(rawCat.includes('mattress')) return 'mattresses';
  if(rawCat.includes('glass')) return 'glasses';
  if(rawCat.includes('scarf')||rawCat.includes('hijab')||rawCat.includes('veil')||rawCat.includes('hijabscar')) return 'scarves';

  return p.category||'other';
}

function label(p){
  return labels[normalizeCategory(p)] || String(p.category||'منتج');
}

  const u=new URL(window.location.href);
  if(cat==='all') u.searchParams.delete('section'); else u.searchParams.set('section',cat);
  if((cat==='shoe_discount'||cat==='clothes') && selectedSize) u.searchParams.set('size',selectedSize);
  else u.searchParams.delete('size');
  history.replaceState({},'',u);
}

function readUrl(){
  const u=new URL(window.location.href);
  const wanted=u.searchParams.get('section');
  cat=['all','shoes','shoes_first','shoe_discount','clothes','bag_a','bag_c','wallets','mattresses','accessories'].includes(wanted)?wanted:'all';
  selectedSize=u.searchParams.get('size')||'';
  if(cat!=='shoe_discount' && cat!=='clothes') selectedSize='';
}

function renderSizeBar(){
  sizebar.innerHTML='';
  if(cat!=='shoe_discount' && cat!=='clothes'){
    sizebar.classList.remove('show');
    return;
  }

  const sizes=availableSizes(cat);
  sizebar.classList.add('show');

  for(const s of sizes){
    const a=document.createElement('a');
    a.className='sizeLink'+(selectedSize===s?' active':'');
    a.href='?section='+encodeURIComponent(cat)+'&size='+encodeURIComponent(s);
    a.textContent='قياس '+s;
    a.onclick=e=>{
      e.preventDefault();
      selectedSize=s;
      updateUrl();
      render();
    };
    sizebar.appendChild(a);
  }

  const all=document.createElement('a');
  all.className='sizeLink'+(!selectedSize?' active':'');
  all.href='?section='+encodeURIComponent(cat);
  all.textContent='كل القياسات';
  all.onclick=e=>{
    e.preventDefault();
    selectedSize='';
    updateUrl();
    render();
  };
  sizebar.appendChild(all);

  const share=document.createElement('button');
  share.className='shareSize';
  share.textContent='📋 نسخ رابط القياس';
  share.onclick=copySizeLink;
  share.title=selectedSize?'نسخ رابط '+labels[cat]+' قياس '+selectedSize:'نسخ رابط '+labels[cat];
  sizebar.appendChild(share);
}

async function copySizeLink(){
  updateUrl();
  const url=window.location.href;
  try{
    await navigator.clipboard.writeText(url);
    alert(selectedSize?'تم نسخ رابط قياس '+selectedSize:'تم نسخ رابط قسم '+labels[cat]);
  }catch(e){
    prompt('انسخي الرابط:',url);
  }
}

function matches(p){
  const c=normalizeCategory(p);
  if(cat==='all') return true;
  if(cat==='accessories') return c==='glasses'||c==='scarves';
  if(cat==='shoes_first') return c==='shoes' && p.shipment===1 && p.price==null && !p.size;
  if(cat==='shoe_discount'){
    if(c!=='shoes' || p.shipment!==2 || Number(p.price)!==28000) return false;
    return !selectedSize || String(p.size||'').trim()===selectedSize;
  }
  if(cat==='clothes' && selectedSize) return c==='clothes' && String(p.size||'').trim()===selectedSize;
  if(c!==cat) return false;
  return true;
}
function render(){
  renderSizeBar();
  document.querySelectorAll('.tab').forEach(b=>b.classList.toggle('active',b.dataset.cat===cat));
  sectionTitle.textContent=cat==='all'?'كل المنتجات':(labels[cat]||cat);
  sectionHint.textContent=(cat==='shoe_discount'||cat==='clothes')
    ? (selectedSize?'عرض '+labels[cat]+' — قياس '+selectedSize:'اختاري القياس المطلوب لفتح رابط مستقل ومشاركته')
    : (cat==='shoes_first'?'الشحنة الأولى — بدون أسعار وبدون قياسات':'');

  const q=search.value.trim().toLowerCase();
  const arr=products.filter(p=>matches(p) && (!q || String(p.code||'').toLowerCase().includes(q) || String(p.label||'').toLowerCase().includes(q)));

  grid.innerHTML='';

  if(!arr.length){
    const title=(cat==='bag_a'||cat==='bag_c') ? 'الحقائب غير موجودة في النسخة المنشورة حالياً' : 'لا توجد منتجات بهذا الاختيار';
    const detail=(cat==='bag_a'||cat==='bag_c')
      ? 'القسم موجود وجاهز، لكن صور هذه الفئة لم تُرفع إلى ملفات الموقع الحالية بعد.'
      : 'جرّبي قياساً أو قسماً آخر.';
    grid.innerHTML='<div class="empty"><b>'+esc(title)+'</b><br>'+esc(detail)+'</div>';
    return;
  }

  for(const p of arr){
    const c=document.createElement('div');
    c.className='card';
    c.innerHTML=
      '<img class="thumb" src="'+img(p.images[0])+'" loading="lazy">'+
      '<div class="info">'+
        '<div class="code">'+esc(p.code)+'</div>'+
        '<div class="meta">'+esc(label(p))+(p.size?' • قياس '+esc(p.size):'')+' • '+p.images.length+' صور</div>'+
        (p.price!=null?'<div class="price">'+money(p.price)+'</div>':'')+
        '<span class="badge">'+(p.shipment===1?'الشحنة الأولى':'الشحنة الثانية')+'</span>'+
      '</div>';
    c.onclick=()=>openProduct(p);
    grid.appendChild(c);
  }
}

function selectCategory(newCat){
  cat=newCat;
  selectedSize='';
  updateUrl();
  render();
  window.scrollTo({top:0,behavior:'smooth'});
}

document.querySelectorAll('.tab').forEach(b=>b.onclick=()=>selectCategory(b.dataset.cat));
search.oninput=render;

function openProduct(p){
  document.getElementById('details').innerHTML=
    '<h2>'+esc(p.code)+'</h2>'+
    '<img id="hero" class="hero" src="'+img(p.images[0])+'">'+
    '<div class="gallery">'+p.images.map(x=>'<img src="'+img(x)+'" onclick="document.getElementById(\'hero\').src=\''+img(x)+'\'">').join('')+'</div>'+
    '<div class="actions">'+
      '<button class="act save" onclick="saveImage(\''+img(p.images[0])+'\',\''+esc(p.code)+'\')">حفظ الصورة</button>'+
      '<button class="act add" onclick=\'addCart('+JSON.stringify(p).replace(/'/g,"&#39;")+')\'>إضافة للحجز</button>'+
    '</div>'+
    '<div class="note"><b>للحجز:</b> خذي لقطة شاشة للمنتج أو احفظي الصورة، ثم أرسليها إلى فيوليت في واتساب. '+
      (p.size?'القياس: '+esc(p.size)+'. ':'')+
      (p.price!=null?'السعر: '+money(p.price)+'.':'')+
    '</div>';
  document.getElementById('po').style.display='block';
}

function closeProduct(){document.getElementById('po').style.display='none';}

function saveImage(url,code){
  const a=document.createElement('a');
  a.href=url;
  a.download=code+'.jpg';
  a.target='_blank';
  a.click();
}

function addCart(p){
  cart.push({code:p.code,size:p.size||'',price:p.price||null,image:p.images[0],label:label(p)});
  document.getElementById('count').textContent=cart.length;
  closeProduct();
}

function openCart(){renderCart();document.getElementById('co').style.display='block';}
function closeCart(){document.getElementById('co').style.display='none';}

function renderCart(){
  document.getElementById('list').innerHTML=cart.length
    ?cart.map((x,i)=>
      '<div class="item"><img src="'+img(x.image)+'"><div class="itemmain"><b>'+esc(x.code)+'</b><br>'+
      esc(x.label)+(x.size?' • قياس '+esc(x.size):'')+(x.price?' • '+money(x.price):'')+
      '</div><button class="remove" onclick="cart.splice('+i+',1);document.getElementById(\'count\').textContent=cart.length;renderCart()">حذف</button></div>'
    ).join('')
    :'لا توجد منتجات للحجز.';
}

function sendWA(){
  if(!settings.whatsapp){alert('لم يتم وضع رقم الواتساب داخل البرنامج بعد.');return}
  if(!cart.length){alert('أضيفي منتجاً واحداً على الأقل.');return}
  const lines=cart.map((x,i)=>`${i+1}. ${x.code}${x.size?' - قياس '+x.size:''}${x.price?' - '+money(x.price):''}`);
  const msg='مرحباً فيوليت، أريد حجز المنتجات التالية:\n'+lines.join('\n')+'\n\nسأرسل صور المنتجات في نفس المحادثة.';
  window.open('https://wa.me/'+settings.whatsapp+'?text='+encodeURIComponent(msg),'_blank');
}

readUrl();
render();
</script>
</body>
</html>
